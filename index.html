      ["栄町商店", 22500, 8, "=B9/6*(C9-6)", "=(B9+D9)*0.05", "=B9+D9+E9"],

      ["平 均", "=AVERAGE(B3:B9)", "", "=AVERAGE(D3:D9)", "=AVERAGE(E3:E9)", "=AVERAGE(F3:F9)"]
    ].map(r => r.join("\t")).join("\n");

    document.getElementById("copyAllBtn").addEventListener("click", async () => {
      try {
        const item = new ClipboardItem({
          "text/html": new Blob([htmlTable], { type: "text/html" }),
          "text/plain": new Blob([plainText], { type: "text/plain" })
        });
        await navigator.clipboard.write([item]);
        document.getElementById("msg").textContent = "コピー完了！スプレッドシートのA1に Ctrl+V で貼り付けてください。";
      } catch (e) {
        document.getElementById("msg").textContent = "コピーに失敗しました: " + e.message;
      }
    });
  </script>
</body>
</html>
